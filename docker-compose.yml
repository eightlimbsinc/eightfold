# Optional: run PostgreSQL locally with Docker instead of a native install.
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eightfold
      POSTGRES_PASSWORD: eightfold
      POSTGRES_DB: eightfold
    ports:
      - "5432:5432"
    volumes:
      - eightfold-pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eightfold"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eightfold-pg:
